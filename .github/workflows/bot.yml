name: SP-12 v4 demo bot

on:
  schedule:
    - cron: "7 * * * *" # every hour at :07 (UTC); GitHub may start it a few minutes late
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test the connection only, run = trade on OKX demo"
        type: choice
        default: check
        options: [check, run]

permissions:
  contents: write
  issues: write # trade watcher comments on the "BOT NOTES inbox" issue

concurrency:
  group: sp12-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bot
        id: bot
        shell: bash # with pipefail, so a failed bot.py still fails this step
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          OKX_BASE_URL: ${{ vars.OKX_BASE_URL }}
        run: python bot.py ${{ github.event.inputs.mode || 'run' }} 2>&1 | tee bot_run.log
      - name: Write trade journal (read-only, never trades)
        if: always()
        continue-on-error: true
        env:
          OKX_BASE_URL: ${{ vars.OKX_BASE_URL }}
        run: python journal.py
      - name: Claude the Analyst - paper stops and resting orders (paper only, never trades)
        if: always()
        continue-on-error: true
        env:
          OKX_BASE_URL: ${{ vars.OKX_BASE_URL }}
        run: python analyst/ledger.py check
      - name: Update the P/L calendar (read-only, never trades)
        if: always()
        continue-on-error: true
        run: python pl_calendar.py
      - name: Trade watcher (read-only, never trades; writes BOT_NOTES.md)
        id: watcher
        if: always()
        continue-on-error: true
        env:
          BOT_OUTCOME: ${{ steps.bot.outcome }}
        run: python watcher.py
      - name: Read the Kraken account for the dashboard (read-only, never trades; writes journal/kraken.json)
        if: always()
        continue-on-error: true
        env:
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_PRIVATE_KEY: ${{ secrets.KRAKEN_PRIVATE_KEY }}
        run: python kraken_sync.py
      - name: Save bot memory (state.json, trades.csv, hold_pile.csv, journal, calendar)
        if: always()
        run: |
          git config user.name "sp12-bot"
          git config user.email "sp12-bot@users.noreply.github.com"
          git add state.json trades.csv journal 2>/dev/null || true
          if [ -f hold_pile.csv ]; then git add hold_pile.csv; fi
          if [ -f CALENDAR.md ]; then git add CALENDAR.md calendars; fi
          if [ -f BOT_NOTES.md ]; then git add BOT_NOTES.md; fi
          git add analyst/ledger.json 2>/dev/null || true
          if [ -f analyst/trades.csv ]; then git add analyst/trades.csv; fi
          git diff --cached --quiet && exit 0
          git commit -m "bot: update state"
          # someone may have pushed during the run (research, dashboard): rebase onto it and retry
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
          done
          exit 1
      - name: Silent alert for new bot notes (@mentions Jeff only for a new ATTENTION)
        if: always() && steps.watcher.outputs.new != '' && steps.watcher.outputs.new != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ATTN: ${{ steps.watcher.outputs.attention_new }}
        run: |
          num=$(gh issue list --state open --search "BOT NOTES inbox in:title" --json number,title \
            --jq '[.[] | select(.title == "BOT NOTES inbox")][0].number // empty')
          if [ -z "$num" ]; then
            url=$(gh issue create --title "BOT NOTES inbox" --body "The trade watcher comments here when it adds notes to BOT_NOTES.md. It only @mentions Jeff for a new ATTENTION. Leave this issue open.")
            num=${url##*/}
          fi
          who=""; [ "$ATTN" = "true" ] && who="@$OWNER ATTENTION. "
          body=$(printf '%sNew notes in [BOT_NOTES.md](%s/%s/blob/main/BOT_NOTES.md). Tell the Chrome Claude: check the bot notes\n\n%s' \
            "$who" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$(head -c 1500 bot_notes_new.md | sed 's/^/> /')")
          gh issue comment "$num" --body "$body"
