name: YouTube transcript (for Chrome Claude)

# Post a comment on any issue starting with "transcript: <youtube url>" (or run by hand with a URL).
# Fetches the captions and replies. Nothing is saved to the repo (public since Oct 14 2026; other people's words).
# NOTE: YouTube blocks GitHub's servers ("confirm you're not a bot"), so comment requests are answered by
# tools/transcript_watch.sh on Jeff's Linux (cron, every 10 min). This workflow is manual-only.
on:
  workflow_dispatch:
    inputs:
      url:
        description: YouTube URL
        required: true

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.comment.body, 'transcript:')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q yt-dlp
      - name: Fetch
        id: f
        env:
          BODY: ${{ github.event.comment.body }}
          INPUT_URL: ${{ github.event.inputs.url }}
        run: |
          URL="${INPUT_URL:-$(echo "$BODY" | grep -oE 'https?://[^ ]+' | head -1)}"
          echo "url=$URL" >> $GITHUB_OUTPUT
          python tools/yt_transcript.py "$URL" research/transcripts > out.txt 2> err.txt && echo ok=1 >> $GITHUB_OUTPUT || echo ok=0 >> $GITHUB_OUTPUT
          cat out.txt err.txt
      - name: Reply
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.f.outputs.ok }}" = "1" ]; then
            F=$(head -1 out.txt); MSG="Transcript fetched (not saved to the repo): $F"
          else
            MSG="Transcript bot could not get captions (YouTube may block GitHub's servers). Error: $(tail -c 300 err.txt). Ask terminal Claude to fetch it from Jeff's Linux machine."
          fi
          gh issue comment ${{ github.event.issue.number }} --body "$MSG"
