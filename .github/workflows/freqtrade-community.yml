name: Freqtrade community scan

# Research only: backtests every strategy from github.com/freqtrade/freqtrade-strategies, unchanged, at Jeff's real
# fee (0.35%) and at 0.1%, on BTC ETH SOL XRP (OKX), 2022-now. Never trades. Results: freqtrade/results/COMMUNITY.md
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      IMG: freqtradeorg/freqtrade:stable
      CFG: /repo/freqtrade/user_data/config_community.json
      UD: /repo/freqtrade/user_data
    steps:
      - uses: actions/checkout@v4
      - name: Get the community strategies
        run: |
          git clone --depth 1 https://github.com/freqtrade/freqtrade-strategies.git /tmp/fs
          mkdir -p community
          cp /tmp/fs/user_data/strategies/*.py /tmp/fs/user_data/strategies/berlinguyinca/*.py community/
          rm -f community/DoesNothingStrategy.py
          ls community | wc -l
      - name: Download OKX price history (5m to 1d, 2021-11 to now)
        run: |
          chmod -R a+rwX "$GITHUB_WORKSPACE"
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" $IMG download-data --config $CFG --userdir $UD \
            --timeframes 5m 15m 30m 1h 4h 1d --timerange 20211101- --pairs BTC/USDT ETH/USDT SOL/USDT XRP/USDT
      - name: Backtest every strategy at 0.35% and 0.1%
        run: |
          mkdir -p freqtrade/results/community
          for f in community/*.py; do
            name=$(basename "$f" .py)
            for fee in 0.0035 0.001; do
              timeout 900 docker run --rm -v "$GITHUB_WORKSPACE:/repo" $IMG backtesting --config $CFG --userdir $UD \
                --strategy-path /repo/community --strategy "$name" --timerange 20220101- --fee $fee --export none \
                > "freqtrade/results/community/${name}_${fee}.txt" 2>&1 || true
            done
            grep -m1 "Total profit %" "freqtrade/results/community/${name}_0.0035.txt" || echo "$name: no result"
          done
      - name: Summary and save
        run: |
          python3 freqtrade/community_summary.py
          git config user.name "sp12-bot"
          git config user.email "sp12-bot@users.noreply.github.com"
          git add freqtrade/results/COMMUNITY.md freqtrade/results/community
          git commit -m "Freqtrade community scan results" || exit 0
          for i in 1 2 3; do git push && exit 0; git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }; done
          exit 1
