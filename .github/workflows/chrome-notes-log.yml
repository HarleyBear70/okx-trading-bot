name: Log Chrome Claude notes

# Chrome Claude posts on issues #3 (trades) and #4 (Claude chat) with Jeff's own login, so GitHub never notifies Jeff.
# This copies each new comment (except the bot's own trade results and terminal Claude's replies) into
# reports/health/chrome_notes.md; the hourly alert watch emails Jeff about new lines there.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

concurrency:
  group: chrome-notes-log
  cancel-in-progress: false

jobs:
  log:
    if: github.event.issue.number == 3 || github.event.issue.number == 4
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Append the comment
        env:
          BODY: ${{ github.event.comment.body }}
          URL: ${{ github.event.comment.html_url }}
          NUM: ${{ github.event.issue.number }}
          WHEN: ${{ github.event.comment.created_at }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/append.py <<'EOF'
          import os
          body = os.environ["BODY"].strip()
          skip = ("Results from this hour's run", "Terminal Claude", "Note from terminal Claude")
          if body.startswith(skip):
              print("not a Chrome Claude note, skipped")
              raise SystemExit(0)
          where = {"3": "#3 trades", "4": "#4 Claude chat"}[os.environ["NUM"]]
          short = " ".join(body.split())[:500]
          os.makedirs("reports/health", exist_ok=True)
          with open("reports/health/chrome_notes.md", "a") as f:
              f.write(f"- {os.environ['WHEN']} | {where} | {os.environ['URL']} | {short}\n")
          EOF
          git config user.name "sp12-bot"
          git config user.email "sp12-bot@users.noreply.github.com"
          # Two comments at the same moment used to clash (run #18). Now each try starts from the latest main
          # and redoes the change, so there is never a merge conflict.
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 /tmp/append.py
            [ "$NUM" = 4 ] && python3 tools/chat_page.py
            git add reports/health/chrome_notes.md CHAT.md 2>/dev/null
            git diff --cached --quiet && exit 0
            git commit -q -m "chrome notes: new comment on #$NUM"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
