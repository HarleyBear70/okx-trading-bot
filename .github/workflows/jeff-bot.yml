name: Jeff top-down bot (15m, paper)

on:
  schedule:
    - cron: "2,17,32,47 * * * *" # every 15 minutes, 2 minutes after each 15m candle closes
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: jeff-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run the 15m paper bot (never places real orders)
        run: python jeff_bot.py
      - name: Brad day-trade forward test (paper, never places real orders)
        run: python brad_day_bot.py || echo "brad-day run failed"
      - name: Silver Bullet forward test (paper, never places real orders)
        run: python sb_bot.py || echo "sb run failed"
      - name: Check Jeff's own paper trades (read-only, never trades; notes closed trades on issue 4)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/jeff_paper_check.py || echo "paper check failed"
      - name: Heartbeat watch + Claude's own paper trades (paper only, never sends orders; notes closed trades on issue 4)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/heartbeat_watch.py || echo "heartbeat watch failed"
      - name: Forward-test weekly report, all paper bots side by side (Sundays ~8 PM ET) on issue 4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(date -u +%u%H)" = "100" ] && [ "$(date -u +%M)" -lt 15 ]; then
            python brad_day_bot.py --report > /tmp/r.txt && gh issue comment 4 --body-file /tmp/r.txt || true
          fi
      - name: Save state
        run: |
          git config user.name "jeff-bot"
          git config user.email "jeff-bot@users.noreply.github.com"
          git add jeff_state.json
          if [ -f jeff_trades.csv ]; then git add jeff_trades.csv; fi
          git add journal/jeff_paper_trades.csv journal/heartbeat_events.csv journal/heartbeat_now.md journal/claude_hb_state.json; if [ -f journal/claude_hb_trades.csv ]; then git add journal/claude_hb_trades.csv; fi
          for f in brad_day_state.json brad_day_trades.csv sb_state.json sb_trades.csv; do if [ -f $f ]; then git add $f; fi; done
          git diff --cached --quiet && exit 0
          git commit -m "jeff bot: update state"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && exit 0; sleep $((i * 5)); done
          exit 1
